<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isócronas a pé</title>
<meta name="description" content="Explore a pé: área alcançável caminhando, pontos para fotografar e luz do dia.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<style>
/* ==== TEMA ==== */
:root {
  --bg: #ffffff; --bg-2: #f4f5f7; --fg: #1d2330; --muted: #667085; --border: #dfe3ea;
  --accent: #2563eb; --danger: #c0352b; --shadow: 0 4px 18px rgba(16,24,40,.14);
  --panel-w: 370px;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #171a21; --bg-2: #222632; --fg: #e8eaf0; --muted: #9aa3b5; --border: #333a4a;
  --accent: #6b9bff; --danger: #ff7a6e; --shadow: 0 4px 18px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { display: flex; overflow: hidden; font-size: 14px; }
button, input, select { font: inherit; color: inherit; }

/* ==== LAYOUT: PAINEL + MAPA ==== */
#panel {
  width: var(--panel-w); flex: none; height: 100%; overflow-y: auto; background: var(--bg);
  border-right: 1px solid var(--border); z-index: 2; display: flex; flex-direction: column;
}
#panel header { padding: 14px 16px 6px; }
#panel h1 { font-size: 18px; margin: 0; }
#panel header p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
#sheet-handle { display: none; }
#map { flex: 1; height: 100%; }
section { padding: 10px 16px 14px; border-top: 1px solid var(--border); }
section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
.row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.row label { flex: 1; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.status { font-size: 12.5px; margin: 6px 0 0; color: var(--muted); min-height: 1em; }
.status.error { color: var(--danger); }
input[type="text"], input[type="search"], input[type="date"], input[type="number"] {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-2);
}
input[type="range"] { flex: 1.3; accent-color: var(--accent); }
.btn { padding: 6px 10px; border: 1px solid var(--border); background: var(--bg-2); border-radius: 8px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }

/* ==== BUSCA ==== */
#search-wrap { position: relative; }
#suggestions {
  list-style: none; margin: 4px 0 0; padding: 4px 0; position: absolute; left: 0; right: 0; top: 100%;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); z-index: 10;
}
#suggestions:empty { display: none; }
#suggestions li { padding: 7px 10px; cursor: pointer; line-height: 1.3; }
#suggestions li small { color: var(--muted); display: block; }
#suggestions li.active, #suggestions li:hover { background: var(--bg-2); }

/* ==== ISÓCRONAS / ROTA ==== */
#legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 12.5px; }
#legend span { display: inline-flex; align-items: center; gap: 5px; }
#legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; opacity: .85; }
#elev { width: 100%; height: 120px; display: block; margin-top: 6px; }

/* ==== CONTROLES DO MAPA ==== */
.maplibregl-ctrl-group button.map-btn { width: auto; white-space: nowrap; background: var(--bg); color: var(--fg); padding: 0 10px; font-size: 13px; }
.maplibregl-ctrl-group { background: var(--bg); }
:root[data-theme="dark"] .maplibregl-ctrl-icon { filter: invert(1); }
.maplibregl-popup-content { background: var(--bg); color: var(--fg); border-radius: 8px; padding: 10px 12px; }
.maplibregl-popup-tip { border-top-color: var(--bg) !important; border-bottom-color: var(--bg) !important; }

/* ==== TOASTS ==== */
#toasts { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 50; max-width: 340px; }
.toast { background: var(--bg); border-left: 4px solid var(--danger); box-shadow: var(--shadow); padding: 8px 12px; border-radius: 6px; font-size: 13px; }
.toast.info { border-left-color: var(--accent); }

/* ==== RESPONSIVO: BOTTOM SHEET ==== */
@media (max-width: 760px) {
  body { display: block; }
  #map { position: fixed; inset: 0; height: auto; }
  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; width: auto; height: 46vh; border-right: 0;
    border-radius: 14px 14px 0 0; box-shadow: var(--shadow); transition: height .2s ease;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #panel.expanded { height: 88vh; }
  #panel.collapsed { height: 112px; overflow: hidden; }
  #sheet-handle { display: block; width: 100%; height: 22px; border: 0; background: none; cursor: pointer; flex: none; }
  #sheet-handle::before { content: ""; display: block; width: 40px; height: 5px; margin: 0 auto; border-radius: 3px; background: var(--border); }
  #panel header { padding-top: 0; }
  #toasts { bottom: auto; top: 12px; left: 12px; right: 12px; max-width: none; }
}
</style>
</head>
<body>
<aside id="panel">
  <button id="sheet-handle" aria-label="Expandir/recolher painel"></button>
  <header>
    <h1>Isócronas a pé</h1>
    <p>Até onde dá pra ir caminhando — e o que fotografar no caminho.</p>
  </header>

  <section id="sec-search">
    <h2>Ponto de partida</h2>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Endereço, lugar ou CEP" autocomplete="off" aria-label="Buscar endereço ou CEP">
      <ul id="suggestions" role="listbox"></ul>
    </div>
    <p class="status" id="search-status"></p>
    <p class="hint">Ou clique no mapa / arraste o pin. Clique direito sempre move o pin.</p>
  </section>

  <section id="sec-iso">
    <h2>Caminhada</h2>
    <div class="row"><label for="times">Anéis (min)</label><input id="times" type="text" value="5, 10, 15, 20" style="flex:1.3" inputmode="numeric" title="Até 4 valores entre 1 e 60"></div>
    <div class="row"><label for="speed">Velocidade <b id="speed-val">5 km/h</b></label><input id="speed" type="range" min="2" max="7" step="0.5" value="5"></div>
    <div class="row"><label for="hills">Evitar ladeiras <b id="hills-val">0.5</b></label><input id="hills" type="range" min="0" max="1" step="0.1" value="0.5"></div>
    <div id="legend"></div>
    <p class="status" id="iso-status">Escolha um ponto para calcular.</p>
  </section>

  <section id="sec-route" hidden>
    <h2>Rota a pé</h2>
    <div class="row"><span id="route-summary" style="flex:1"></span><button class="btn" id="route-clear" type="button">Limpar</button></div>
    <canvas id="elev" height="120" aria-label="Perfil de elevação"></canvas>
    <p class="status" id="route-status"></p>
  </section>
</aside>
<div id="map"></div>
<div id="toasts" aria-live="polite"></div>

<script>
'use strict';
// ==== CONFIG ====
const CONFIG = {
  userAgentHint: 'isocronas-a-pe (github.com/arthurmundim/isocronas-a-pe)',
  styles: {
    light: 'https://tiles.openfreemap.org/styles/positron',
    dark: 'https://tiles.openfreemap.org/styles/dark',
  },
  defaultCenter: [-46.6559, -23.5614], // Av. Paulista (lng, lat)
  defaultZoom: 13,
  valhalla: 'https://valhalla1.openstreetmap.de',
  ringColors: ['#1a9850', '#91cf60', '#fee08b', '#fc8d59', '#d73027'],
  photon: 'https://photon.komoot.io/api/',
  brasilApiCep: 'https://brasilapi.com.br/api/cep/v2/',
  nominatim: 'https://nominatim.openstreetmap.org/search',
};

// ==== ESTADO ====
const state = {
  point: null,          // { lat, lng, label }
  style: 'light',
  times: [5, 10, 15, 20],
  speed: 5,             // km/h
  hills: 0.5,           // use_hills do Valhalla (0 = indiferente, 1 = evita ladeiras)
  iso: null,            // FeatureCollection das isócronas (maior primeiro)
  routeTarget: null,    // { lat, lng }
};

// ==== UTILITÁRIOS ====
const $ = (sel) => document.querySelector(sel);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const round = (x, d = 5) => Math.round(x * 10 ** d) / 10 ** d;

function toast(msg, type = 'error', ms = 6000) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function setStatus(id, msg, isError = false) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg || '';
  el.classList.toggle('error', !!isError);
}

// ==== REDE: CACHE + RATE LIMIT ====
class ApiError extends Error {
  constructor(api, msg, status) { super(msg); this.api = api; this.status = status; }
}

// Cache em memória por chave (URL + body). Guarda a Promise, então chamadas idênticas simultâneas compartilham a mesma requisição.
const cache = new Map();
function cached(key, fn) {
  if (cache.has(key)) return cache.get(key);
  const p = fn().catch((e) => { cache.delete(key); throw e; });
  cache.set(key, p);
  return p;
}

// Fila serial com intervalo mínimo entre requisições (APIs compartilhadas: Nominatim, Overpass, Valhalla).
function limiter(minIntervalMs) {
  let chain = Promise.resolve(), last = 0;
  return (fn) => {
    const run = chain.then(async () => {
      const wait = last + minIntervalMs - Date.now();
      if (wait > 0) await new Promise((r) => setTimeout(r, wait));
      try { return await fn(); } finally { last = Date.now(); }
    });
    chain = run.catch(() => {});
    return run;
  };
}
const limits = {
  nominatim: limiter(1100),
  valhalla: limiter(400),
};

async function fetchJSON(api, url, opts = {}, timeoutMs = 30000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  let res;
  try {
    res = await fetch(url, { ...opts, signal: ctrl.signal });
  } catch (e) {
    throw new ApiError(api, e.name === 'AbortError' ? `${api}: tempo esgotado` : `${api}: sem conexão ou bloqueado`);
  } finally { clearTimeout(timer); }
  let body = null;
  try { body = await res.json(); } catch { /* corpo não-JSON */ }
  if (!res.ok) {
    let detail = String(body?.error || body?.message || '');
    if (/edges|location/i.test(detail)) detail = 'nenhuma rua caminhável perto desse ponto';
    else if (detail.length > 90) detail = detail.slice(0, 90) + '…';
    const msg = res.status === 429 ? `${api}: muitas requisições, tente em instantes`
      : res.status >= 500 ? `${api}: servidor indisponível (${res.status})`
      : `${api}: erro ${res.status}${detail ? ' – ' + detail : ''}`;
    throw new ApiError(api, msg, res.status);
  }
  if (body == null) throw new ApiError(api, `${api}: resposta inválida`);
  return body;
}

// ==== MAPA ====
const map = new maplibregl.Map({
  container: 'map',
  style: CONFIG.styles[state.style],
  center: CONFIG.defaultCenter,
  zoom: CONFIG.defaultZoom,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right');
map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

// ==== CAMADAS (sobrevivem à troca de estilo) ====
// setStyle() apaga sources/layers custom; cada overlay registrado é re-adicionado em todo 'style.load'.
const EMPTY = { type: 'FeatureCollection', features: [] };
const sourceData = {};
const overlays = [];
function registerOverlay(addFn) {
  overlays.push(addFn);
  if (map.isStyleLoaded()) addFn();
}
map.on('style.load', () => overlays.forEach((fn) => fn()));
function ensureSource(id) {
  if (!map.getSource(id)) map.addSource(id, { type: 'geojson', data: sourceData[id] || EMPTY });
}
function setSourceData(id, fc) {
  sourceData[id] = fc || EMPTY;
  map.getSource(id)?.setData(sourceData[id]);
}

// ==== ESTILO CLARO/ESCURO ====
class StyleToggle {
  onAdd() {
    this.el = document.createElement('div');
    this.el.className = 'maplibregl-ctrl maplibregl-ctrl-group';
    this.el.innerHTML = '<button class="map-btn" type="button" title="Alternar mapa claro/escuro"></button>';
    this.el.firstChild.addEventListener('click', () => setMapStyle(state.style === 'light' ? 'dark' : 'light'));
    this.render();
    return this.el;
  }
  render() { if (this.el) this.el.firstChild.textContent = state.style === 'light' ? '🌙 Escuro' : '☀️ Claro'; }
  onRemove() { this.el.remove(); }
}
const styleToggle = new StyleToggle();
map.addControl(styleToggle, 'top-left');

function setMapStyle(style, { apply = true } = {}) {
  if (!CONFIG.styles[style]) style = 'light';
  const changed = style !== state.style;
  state.style = style;
  document.documentElement.dataset.theme = style;
  styleToggle.render();
  // diff:false força um 'style.load' completo, que re-adiciona os overlays.
  if (changed && apply) map.setStyle(CONFIG.styles[style], { diff: false });
  onStateChanged();
}
function onStateChanged() { /* estado na URL: seção final */ }

const pin = new maplibregl.Marker({ color: '#e5484d', draggable: true });
pin.on('dragend', () => { const { lng, lat } = pin.getLngLat(); setPoint(lat, lng, null, { fly: false }); });

// Clique dentro da mancha = rota até lá; fora = novo ponto. Clique direito sempre move o pin.
map.on('click', (e) => {
  const { lat, lng } = e.lngLat;
  if (insideIsochrone(lng, lat)) showRoute(lat, lng);
  else setPoint(lat, lng, null, { fly: false });
});
map.on('contextmenu', (e) => setPoint(e.lngLat.lat, e.lngLat.lng, null, { fly: false }));

// ==== PONTO DE PARTIDA ====
function setPoint(lat, lng, label = null, { fly = true } = {}) {
  state.point = { lat: round(lat), lng: round(lng), label };
  pin.setLngLat([state.point.lng, state.point.lat]).addTo(map);
  if (fly) map.flyTo({ center: [lng, lat], zoom: Math.max(map.getZoom(), 14) });
  setStatus('search-status', label ? `📍 ${label}` : `📍 ${state.point.lat.toFixed(5)}, ${state.point.lng.toFixed(5)}`);
  onPointChanged();
}
function onPointChanged() {
  clearRoute();
  computeIsochrones();
  onStateChanged();
}

// ==== BUSCA: CEP (BrasilAPI → Nominatim) ====
const isCep = (q) => /^\d{5}-?\d{3}$/.test(q.trim());

// Nominatim: só para geocodificar o endereço de um CEP (nunca autocomplete). 1 req/s via limiter.
function nominatimSearch(params) {
  const url = CONFIG.nominatim + '?' + new URLSearchParams({ format: 'jsonv2', limit: 1, ...params });
  return cached(url, () => limits.nominatim(() => fetchJSON('Nominatim', url)));
}

async function resolveCep(raw) {
  const cep = raw.replace(/\D/g, '');
  const data = await cached('cep:' + cep, () => fetchJSON('BrasilAPI', CONFIG.brasilApiCep + cep)).catch((e) => {
    if (e.status === 404) throw new ApiError('BrasilAPI', `CEP ${cep} não encontrado`);
    throw e;
  });
  const label = [data.street, data.neighborhood, `${data.city}/${data.state}`].filter(Boolean).join(', ');
  const c = data.location?.coordinates || {};
  const apiCoords = c.latitude && c.longitude ? { lat: +c.latitude, lng: +c.longitude } : null;
  // As coordenadas do BrasilAPI costumam ser o centro da cidade; quando há rua, o Nominatim é bem mais preciso.
  if (data.street || !apiCoords) {
    try {
      const params = data.street
        ? { street: data.street, city: data.city, state: data.state, country: 'Brasil' }
        : { postalcode: cep, city: data.city, country: 'Brasil' };
      const [hit] = await nominatimSearch(params);
      if (hit) return { lat: +hit.lat, lng: +hit.lon, label: `${label} (CEP ${cep})` };
    } catch (e) {
      if (!apiCoords) throw e;
    }
  }
  if (apiCoords) return { ...apiCoords, label: `${label} (CEP ${cep}, aproximado)` };
  throw new ApiError('Nominatim', `Não achei coordenadas para o CEP ${cep}`);
}

// ==== BUSCA: AUTOCOMPLETE (Photon) ====
async function photonSearch(q) {
  const c = map.getCenter();
  const url = CONFIG.photon + '?' + new URLSearchParams({ q, limit: 6, lat: c.lat.toFixed(3), lon: c.lng.toFixed(3) });
  const data = await cached(url, () => fetchJSON('Photon', url));
  return data.features.map((f) => {
    const p = f.properties;
    const title = p.name || [p.street, p.housenumber].filter(Boolean).join(', ') || p.city || '(sem nome)';
    const street = p.name && p.street ? [p.street, p.housenumber].filter(Boolean).join(', ') : '';
    const sub = [...new Set([street, p.district, p.city, p.state, p.country])].filter((x) => x && x !== title).join(' · ');
    const [lng, lat] = f.geometry.coordinates;
    return { lat, lng, title, sub };
  });
}

let suggestions = [], activeIdx = -1, searchSeq = 0;
function renderSuggestions() {
  $('#suggestions').innerHTML = suggestions.map((s, i) =>
    `<li role="option" data-i="${i}" class="${i === activeIdx ? 'active' : ''}">${esc(s.title)}<small>${esc(s.sub || '')}</small></li>`).join('');
}
function chooseSuggestion(i) {
  const s = suggestions[i];
  if (!s) return;
  suggestions = []; activeIdx = -1; renderSuggestions();
  $('#search').value = s.title;
  if (s.cep) return searchCep(s.cep);
  setPoint(s.lat, s.lng, [s.title, s.sub].filter(Boolean).join(' · '));
}
async function searchCep(q) {
  setStatus('search-status', 'Buscando CEP…');
  try {
    const r = await resolveCep(q);
    setPoint(r.lat, r.lng, r.label);
  } catch (e) {
    setStatus('search-status', e.message, true);
  }
}

const runAutocomplete = debounce(async (q) => {
  const seq = ++searchSeq;
  try {
    const res = await photonSearch(q);
    if (seq !== searchSeq) return;
    suggestions = res; activeIdx = -1; renderSuggestions();
    setStatus('search-status', res.length ? '' : 'Nada encontrado.');
  } catch (e) {
    if (seq === searchSeq) setStatus('search-status', e.message, true);
  }
}, 400);

$('#search').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  if (isCep(q)) {
    searchSeq++;
    suggestions = [{ cep: q, title: `Buscar CEP ${q}`, sub: 'BrasilAPI' }]; activeIdx = 0; renderSuggestions();
    return;
  }
  if (q.length < 3) { searchSeq++; suggestions = []; renderSuggestions(); return; }
  runAutocomplete(q);
});
$('#search').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!suggestions.length) return;
    e.preventDefault();
    activeIdx = (activeIdx + (e.key === 'ArrowDown' ? 1 : -1) + suggestions.length) % suggestions.length;
    renderSuggestions();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const q = e.target.value.trim();
    if (isCep(q)) { suggestions = []; renderSuggestions(); searchCep(q); }
    else chooseSuggestion(Math.max(activeIdx, 0));
  } else if (e.key === 'Escape') { suggestions = []; renderSuggestions(); }
});
$('#suggestions').addEventListener('mousedown', (e) => {
  const li = e.target.closest('li');
  if (li) { e.preventDefault(); chooseSuggestion(+li.dataset.i); }
});
$('#search').addEventListener('blur', () => setTimeout(() => { suggestions = []; renderSuggestions(); }, 150));

// ==== VALHALLA ====
function valhalla(path, body) {
  const json = JSON.stringify(body);
  return cached(path + json, () => limits.valhalla(() => fetchJSON('Valhalla', CONFIG.valhalla + path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json,
  })));
}
const pedestrianCosting = () => ({ pedestrian: { walking_speed: state.speed, use_hills: state.hills } });

// Decodifica polyline com precisão 6 (formato do Valhalla) → [[lng, lat], ...]
function decodePolyline6(str) {
  const coords = [];
  let i = 0, lat = 0, lng = 0;
  while (i < str.length) {
    for (const axis of [0, 1]) {
      let shift = 0, result = 0, b;
      do { b = str.charCodeAt(i++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = result & 1 ? ~(result >> 1) : result >> 1;
      if (axis === 0) lat += d; else lng += d;
    }
    coords.push([lng / 1e6, lat / 1e6]);
  }
  return coords;
}
function fmtDuration(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')} min`;
}

// ==== ISÓCRONAS ====
function ringColor(i, n) {
  const ramp = CONFIG.ringColors;
  return ramp[n === 1 ? 0 : Math.round((i * (ramp.length - 1)) / (n - 1))];
}
// No celular o bottom sheet cobre a parte de baixo do mapa.
const isMobile = () => matchMedia('(max-width: 760px)').matches;
const mapPadding = () => (isMobile() ? { top: 50, left: 30, right: 50, bottom: $('#panel').offsetHeight + 20 } : 40);
const firstSymbolLayer = () => map.getStyle().layers.find((l) => l.type === 'symbol')?.id;

registerOverlay(() => {
  ensureSource('iso');
  const before = firstSymbolLayer();
  map.addLayer({ id: 'iso-fill', type: 'fill', source: 'iso', paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.2 } }, before);
  map.addLayer({ id: 'iso-line', type: 'line', source: 'iso', paint: { 'line-color': ['get', 'color'], 'line-width': 2, 'line-opacity': 0.9 } }, before);
});

function parseTimes(text) {
  const vals = [...new Set(String(text).split(/[^\d]+/).map(Number).filter((n) => n >= 1 && n <= 60))].sort((a, b) => a - b);
  return vals.slice(0, 4);
}
function renderLegend() {
  const n = state.times.length;
  $('#legend').innerHTML = state.times.map((t, i) => `<span><i style="background:${ringColor(i, n)}"></i>até ${t} min</span>`).join('');
}

let isoSeq = 0;
async function computeIsochrones() {
  renderLegend();
  if (!state.point) return;
  const seq = ++isoSeq;
  const { lat, lng } = state.point;
  setStatus('iso-status', 'Calculando área alcançável…');
  try {
    const data = await valhalla('/isochrone', {
      locations: [{ lat, lon: lng }],
      costing: 'pedestrian',
      costing_options: pedestrianCosting(),
      contours: state.times.map((time) => ({ time })),
      polygons: true, denoise: 0.3, generalize: 15,
    });
    if (seq !== isoSeq) return;
    const n = state.times.length;
    const features = data.features
      .filter((f) => /Polygon/.test(f.geometry?.type))
      .map((f) => ({ ...f, properties: { contour: f.properties.contour, color: ringColor(state.times.indexOf(f.properties.contour), n) } }))
      .sort((a, b) => b.properties.contour - a.properties.contour);
    state.iso = { type: 'FeatureCollection', features };
    setSourceData('iso', state.iso);
    const km2 = features.length ? (turf.area(features[0]) / 1e6).toFixed(2) : 0;
    setStatus('iso-status', `Em ${state.times.at(-1)} min a ${state.speed} km/h: ~${km2} km². Clique na mancha para ver a rota.`);
    if (features.length) map.fitBounds(turf.bbox(features[0]), { padding: mapPadding(), maxZoom: 16, duration: 600 });
    onIsochronesChanged();
  } catch (e) {
    if (seq !== isoSeq) return;
    state.iso = null;
    setSourceData('iso', EMPTY);
    setStatus('iso-status', e.message, true);
    toast('Isócronas: ' + e.message);
  }
}
function onIsochronesChanged() { /* pontos para fotografar: próxima seção */ }

function insideIsochrone(lng, lat) {
  const outer = state.iso?.features[0];
  return !!outer && turf.booleanPointInPolygon([lng, lat], outer);
}
// Menor anel (em minutos) que contém o ponto, ou null.
function ringOf(lng, lat) {
  const fs = state.iso?.features || [];
  for (let i = fs.length - 1; i >= 0; i--) if (turf.booleanPointInPolygon([lng, lat], fs[i])) return fs[i].properties.contour;
  return null;
}

const recomputeIso = debounce(() => {
  computeIsochrones();
  if (state.routeTarget) showRoute(state.routeTarget.lat, state.routeTarget.lng);
  onStateChanged();
}, 500);
$('#times').addEventListener('change', (e) => {
  const t = parseTimes(e.target.value);
  if (t.length) state.times = t;
  e.target.value = state.times.join(', ');
  recomputeIso();
});
$('#speed').addEventListener('input', (e) => { state.speed = +e.target.value; $('#speed-val').textContent = `${state.speed} km/h`; recomputeIso(); });
$('#hills').addEventListener('input', (e) => { state.hills = +e.target.value; $('#hills-val').textContent = state.hills.toFixed(1); recomputeIso(); });

// ==== ROTA + PERFIL DE ELEVAÇÃO ====
registerOverlay(() => {
  ensureSource('route');
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', filter: ['==', '$type', 'LineString'],
    layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#ffffff', 'line-width': 7, 'line-opacity': 0.8 } });
  map.addLayer({ id: 'route-line', type: 'line', source: 'route', filter: ['==', '$type', 'LineString'],
    layout: { 'line-cap': 'round', 'line-join': 'round' }, paint: { 'line-color': '#2563eb', 'line-width': 4 } });
  map.addLayer({ id: 'route-end', type: 'circle', source: 'route', filter: ['==', '$type', 'Point'],
    paint: { 'circle-radius': 6, 'circle-color': '#2563eb', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
});

let routeSeq = 0;
async function showRoute(lat, lng) {
  if (!state.point) return;
  const seq = ++routeSeq;
  state.routeTarget = { lat, lng };
  $('#sec-route').hidden = false;
  $('#route-summary').textContent = '';
  drawElevation([]);
  setStatus('route-status', 'Calculando rota…');
  setSourceData('route', { type: 'FeatureCollection', features: [turf.point([lng, lat])] });
  try {
    const data = await valhalla('/route', {
      locations: [{ lat: state.point.lat, lon: state.point.lng }, { lat: round(lat), lon: round(lng) }],
      costing: 'pedestrian', costing_options: pedestrianCosting(),
      directions_options: { units: 'kilometers', language: 'pt-BR' },
    });
    if (seq !== routeSeq) return;
    const leg = data.trip.legs[0];
    const line = turf.lineString(decodePolyline6(leg.shape));
    setSourceData('route', { type: 'FeatureCollection', features: [line, turf.point([lng, lat])] });
    const { time, length } = data.trip.summary;
    $('#route-summary').innerHTML = `<b>${fmtDuration(time)}</b> · ${length.toFixed(2)} km`;
    setStatus('route-status', 'Carregando elevação…');
    const h = await valhalla('/height', { encoded_polyline: leg.shape, shape_format: 'polyline6', range: true, resample_distance: Math.max(10, Math.round(length * 1000 / 200)) });
    if (seq !== routeSeq) return;
    const pts = (h.range_height || []).filter((p) => p[1] != null);
    const { gain, loss } = drawElevation(pts);
    $('#route-summary').innerHTML += ` · ↑${gain} m ↓${loss} m`;
    setStatus('route-status', '');
  } catch (e) {
    if (seq !== routeSeq) return;
    setStatus('route-status', e.message, true);
  }
}
function clearRoute() {
  routeSeq++;
  state.routeTarget = null;
  setSourceData('route', EMPTY);
  $('#sec-route').hidden = true;
}
$('#route-clear').addEventListener('click', clearRoute);

function drawElevation(pts) {
  const cv = $('#elev'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  if (pts.length < 2) return { gain: 0, loss: 0 };
  const css = getComputedStyle(document.documentElement);
  const [fg, muted, accent] = ['--fg', '--muted', '--accent'].map((v) => css.getPropertyValue(v).trim());
  const dists = pts.map((p) => p[0]), elevs = pts.map((p) => p[1]);
  const maxD = dists.at(-1) || 1;
  let minE = Math.min(...elevs), maxE = Math.max(...elevs);
  if (maxE - minE < 10) { const mid = (maxE + minE) / 2; minE = mid - 5; maxE = mid + 5; }
  const pad = { l: 34, r: 6, t: 8, b: 18 };
  const x = (d) => pad.l + (d / maxD) * (W - pad.l - pad.r);
  const y = (e) => pad.t + (1 - (e - minE) / (maxE - minE)) * (H - pad.t - pad.b);
  ctx.beginPath();
  pts.forEach(([d, e], i) => (i ? ctx.lineTo(x(d), y(e)) : ctx.moveTo(x(d), y(e))));
  ctx.strokeStyle = accent; ctx.lineWidth = 2; ctx.stroke();
  ctx.lineTo(x(maxD), H - pad.b); ctx.lineTo(x(0), H - pad.b); ctx.closePath();
  ctx.globalAlpha = 0.18; ctx.fillStyle = accent; ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = muted; ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${Math.round(maxE)} m`, pad.l - 4, pad.t + 8);
  ctx.fillText(`${Math.round(minE)} m`, pad.l - 4, H - pad.b);
  ctx.textAlign = 'left'; ctx.fillText('0', pad.l, H - 4);
  ctx.textAlign = 'right'; ctx.fillStyle = fg; ctx.fillText(`${(maxD / 1000).toFixed(2)} km`, W - pad.r, H - 4);
  // Ganho/perda acumulados, ignorando ruído < 1 m entre amostras.
  let gain = 0, loss = 0, ref = elevs[0];
  for (const e of elevs) {
    if (e - ref >= 1) { gain += e - ref; ref = e; } else if (ref - e >= 1) { loss += ref - e; ref = e; }
  }
  return { gain: Math.round(gain), loss: Math.round(loss) };
}

// ==== PAINEL MOBILE (BOTTOM SHEET) ====
$('#sheet-handle').addEventListener('click', () => {
  const p = $('#panel');
  if (p.classList.contains('collapsed')) p.classList.remove('collapsed');
  else if (p.classList.contains('expanded')) { p.classList.remove('expanded'); p.classList.add('collapsed'); }
  else p.classList.add('expanded');
});

// ==== INICIALIZAÇÃO ====
renderLegend();
</script>
</body>
